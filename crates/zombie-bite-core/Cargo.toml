[package]
name = "zombie-bite-core"
description = "Fork a live relay chain and its parachains into a local network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zombienet-sdk = "0.5.1"
zombienet-provider = "0.5.1"
zombienet-orchestrator = "0.5.1"
zombienet-support = "0.5.1"
zombienet-configuration = "0.5.1"
tokio = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
fxhash = "0.2"
serde = "1"
serde_json = "1"
substorager = "0.11"
subhasher = "0.11"
array-bytes = "6.2"
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
futures = "0.3"
hex = "0.4"
scale-value = "0.16"
tar = "0.4"
flate2 = "1.0"
sp-core = "34.0.0"
toml = "0.9"

[dev-dependencies]
tracing-subscriber = "0.3.18"
